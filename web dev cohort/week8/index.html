<html>
    <head>
        <script>
            async function add() {
                const a = document.getElementById("first").value 
                const b = document.getElementById("second").value

                const res = await fetch("https://localhost:3000/sum", {
                    method: "POST",
                    headers: {
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify({
                        a:a,
                        b:b
                    })
                })
                const json = await res.json();
                document.getElementById("response").innerHTML = json.ans
            }
        </script>
    </head>
    <body>
        <input type="text" placeholder="first number">
        <input type="text" placeholder="second number">

        <button onclick="add()">Add</button>
        <button>Sub</button>
        <button>Div</button>
        <button>Mul</button>

        <div id="response"></div>
    </body>
</html>
